<!DOCTYPE html>
<html>
<head>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="3d-container" style="width: 600px; height: 600px;"></div>
    <svg id="2d-cross-section" width="600" height="600" viewBox="0 0 600 600"></svg>
    <script>
        const width = 600;
        const height = 600;
        const depth = 600;
        const numPoints = 1000; // Change this value to control the number of points
        const perturbation = 5; // Adjust this value to control the level of randomness
        let seed = 42; // Change this seed to get different results

        // Seeded random number generator
        function seededRandom() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        let points = d3.range(numPoints).map(() => [
            seededRandom() * width,
            seededRandom() * height,
            seededRandom() * depth
        ]);

        // Lloyd's relaxation in 3D
        function lloydRelaxation(points) {
            // Placeholder for 3D Voronoi relaxation
            // Implement 3D Voronoi relaxation here
            return points.map(point => [
                point[0] + (seededRandom() - 0.5) * perturbation,
                point[1] + (seededRandom() - 0.5) * perturbation,
                point[2] + (seededRandom() - 0.5) * perturbation
            ]);
        }

        // Three.js setup for 3D rendering
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // Set background to white
        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(width, height);
        document.getElementById('3d-container').appendChild(renderer.domElement);

        // Add points to the scene
        points.forEach(point => {
            const geometry = new THREE.SphereGeometry(2, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Red points
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(point[0] - width / 2, point[1] - height / 2, point[2] - depth / 2);
            scene.add(sphere);
        });

        // Add edges to the scene (placeholder for actual Voronoi edges)
        // You can replace this with actual Voronoi edge computation
        points.forEach((point, i) => {
            if (i < points.length - 1) {
                const material = new THREE.LineBasicMaterial({ color: 0x000000 }); // Black lines
                const geometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(point[0] - width / 2, point[1] - height / 2, point[2] - depth / 2),
                    new THREE.Vector3(points[i + 1][0] - width / 2, points[i + 1][1] - height / 2, points[i + 1][2] - depth / 2)
                ]);
                const line = new THREE.Line(geometry, material);
                scene.add(line);
            }
        });

        camera.position.z = 800;

        function animate() {
            requestAnimationFrame(animate);
            scene.rotation.y += 0.01; // Slowly rotate the scene
            renderer.render(scene, camera);
        }
        animate();

        // D3.js setup for 2D cross-section
        const svg = d3.select(document.getElementById("2d-cross-section"));
        let crossSectionZ = 0;

        function drawCrossSection(points, z) {
            const crossSectionPoints = points.filter(point => Math.abs(point[2] - z) < 10);
            const voronoi = d3.voronoi()
                .extent([[0, 0], [width, height]]);

            const diagram = voronoi(crossSectionPoints.map(p => [p[0], p[1]]));

            svg.selectAll("path").remove();
            svg.selectAll("circle").remove();

            svg.selectAll("path")
                .data(diagram.edges.filter(d => d && d[0] && d[1])) // Filter out undefined edges
                .enter().append("path")
                .attr("d", d => `M${d[0][0]},${d[0][1]}L${d[1][0]},${d[1][1]}`)
                .attr("stroke", "black");

            svg.selectAll("circle")
                .data(crossSectionPoints)
                .enter().append("circle")
                .attr("cx", d => d[0])
                .attr("cy", d => d[1])
                .attr("r", 2)
                .attr("fill", "red");
        }

        function updateCrossSection() {
            drawCrossSection(points, crossSectionZ);
            crossSectionZ += 1;
            if (crossSectionZ > depth) crossSectionZ = 0;
            requestAnimationFrame(updateCrossSection);
        }

        // Initial draw
        drawCrossSection(points, crossSectionZ);
        updateCrossSection();
    </script>
</body>
</html>
